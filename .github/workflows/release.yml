# Release Workflow v3.0.0
# Contract: specs/019-release-workflow/contracts/workflow-interface.md
#
# Manual semantic-release publication. Git pushes use a repository-scoped
# deploy key; GITHUB_TOKEN remains limited to GitHub release API operations.

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual release)"
        required: false
        type: boolean
        default: false

env:
  # Bun 1.3.12 produced macOS compiled binaries that exit 137 immediately on launch.
  BUN_VERSION: "1.3.10"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.published.outputs.version }}
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.22.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Setup npm publishing runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0

      - name: Verify npm Trusted Publishing client
        run: |
          node --version
          npm --version
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { throw new Error("npm " + process.argv[1] + " does not support Trusted Publishing; npm >=11.5.1 is required") }' "$(npm --version)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure release GPG signing
        if: github.event.inputs.dry_run != 'true'
        id: configure_gpg
        run: ./scripts/release/configure-gpg-signing.sh
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_KEY_NAME: Corwin Marsh
          RELEASE_GPG_KEY_EMAIL: corwinm@users.noreply.github.com

      - name: Verify GPG commit signing
        if: github.event.inputs.dry_run != 'true'
        run: ./scripts/release/verify-gpg-signing.sh
        env:
          RELEASE_GPG_FINGERPRINT: ${{ steps.configure_gpg.outputs.fingerprint }}
          RELEASE_GPG_KEY_NAME: Corwin Marsh
          RELEASE_GPG_KEY_EMAIL: corwinm@users.noreply.github.com
          GIT_AUTHOR_NAME: Corwin Marsh
          GIT_AUTHOR_EMAIL: corwinm@users.noreply.github.com
          GIT_COMMITTER_NAME: Corwin Marsh
          GIT_COMMITTER_EMAIL: corwinm@users.noreply.github.com

      - name: Snapshot existing release tags
        if: github.event.inputs.dry_run != 'true'
        run: git tag --list 'v*' --sort=refname > "$RUNNER_TEMP/release-tags-before"

      - name: Run semantic-release dry run
        if: github.event.inputs.dry_run == 'true'
        run: |
          pnpm run build:all
          ./scripts/generate-checksums.sh
          pnpm exec semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      - name: Run semantic-release publication
        if: github.event.inputs.dry_run != 'true'
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          GIT_AUTHOR_NAME: Corwin Marsh
          GIT_AUTHOR_EMAIL: corwinm@users.noreply.github.com
          GIT_COMMITTER_NAME: Corwin Marsh
          GIT_COMMITTER_EMAIL: corwinm@users.noreply.github.com

      - name: Detect newly published version
        id: published
        if: github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          git tag --list 'v*' --sort=refname > "$RUNNER_TEMP/release-tags-after"
          mapfile -t new_tags < <(comm -13 "$RUNNER_TEMP/release-tags-before" "$RUNNER_TEMP/release-tags-after")
          if [ "${#new_tags[@]}" -eq 0 ]; then
            echo "No release was published."
            exit 0
          fi
          if [ "${#new_tags[@]}" -ne 1 ]; then
            printf 'Expected one new release tag, found: %s\n' "${new_tags[*]}" >&2
            exit 1
          fi
          version="${new_tags[0]#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected release tag: ${new_tags[0]}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release summary
        if: success()
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "- Dry run completed; nothing was published." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.published.outputs.version }}" ]; then
            echo "- Published version ${{ steps.published.outputs.version }} to npm and GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
            echo "- Exact-version public verification will run next." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No releasable changes were found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean up release GPG material
        if: always()
        run: ./scripts/release/configure-gpg-signing.sh --cleanup

  verify-published:
    name: Verify published release
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/verify-aw-release.yml
    with:
      version: ${{ needs.release.outputs.version }}
