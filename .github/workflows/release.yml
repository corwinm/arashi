# Release Workflow v1.0.0
# Contract: specs/019-release-workflow/contracts/workflow-interface.md
#
# This workflow automates the complete release process:
# - Parses conventional commits to determine semantic version bump
# - Builds multi-platform binaries (Linux x64, macOS ARM64, Windows x64)
# - Creates GitHub release with generated changelog
# - Publishes package to npm registry (if NPM_TOKEN configured)
#
# Trigger: Manual workflow dispatch from GitHub Actions UI
# Target: Complete release in under 10 minutes from trigger to publication

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write         # Create tags, commits, releases
  pull-requests: write    # Comment on PRs (optional)
  issues: write           # Comment on closed issues (optional)

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true  # Stop all builds if any platform fails (atomic release guarantee)
      matrix:
        target:
          - bun-linux-x64
          - bun-darwin-arm64
          - bun-windows-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: repos/arashi

      - name: Build binary for ${{ matrix.target }}
        run: |
          echo "🔨 Building binary for ${{ matrix.target }}..."
          mkdir -p dist
          bun build src/index.ts \
            --compile \
            --target=${{ matrix.target }} \
            --minify \
            --sourcemap \
            --bytecode \
            --outfile dist/arashi-${{ matrix.target }}
          
          # Check binary size
          BINARY_SIZE=$(du -h dist/arashi-${{ matrix.target }}* | cut -f1)
          echo "✅ Binary built successfully: $BINARY_SIZE"
          
          # Verify binary exists
          if [ ! -f dist/arashi-${{ matrix.target }}* ]; then
            echo "❌ Error: Binary not found after build"
            exit 1
          fi
        working-directory: repos/arashi
        env:
          NODE_ENV: production

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: arashi-${{ matrix.target }}
          path: repos/arashi/dist/arashi-${{ matrix.target }}*
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install semantic-release
        run: |
          cd repos/arashi
          bun install semantic-release @semantic-release/git @semantic-release/changelog @semantic-release/npm @semantic-release/github

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: repos/arashi/dist
          merge-multiple: true

      - name: Verify all binaries present
        run: |
          cd repos/arashi/dist
          echo "📦 Verifying downloaded artifacts..."
          
          REQUIRED_BINARIES=("arashi-bun-linux-x64" "arashi-bun-darwin-arm64" "arashi-bun-windows-x64.exe")
          MISSING=0
          
          for binary in "${REQUIRED_BINARIES[@]}"; do
            if [ -f "$binary" ]; then
              SIZE=$(du -h "$binary" | cut -f1)
              echo "✅ $binary ($SIZE)"
            else
              echo "❌ Missing: $binary"
              MISSING=1
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            echo "❌ Error: Not all required binaries are present"
            exit 1
          fi
          
          echo "✅ All binaries verified"

      - name: Check NPM token availability
        id: npm_token_check
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "npm_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ NPM_TOKEN not configured - npm publishing will be skipped"
          else
            echo "npm_available=true" >> $GITHUB_OUTPUT
            echo "✓ NPM_TOKEN configured - package will be published to npm"
          fi

      - name: Run semantic-release
        run: |
          cd repos/arashi
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "🧪 Running in DRY-RUN mode - no release will be created"
            bunx semantic-release --dry-run
          else
            echo "🚀 Running semantic-release..."
            bunx semantic-release
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_ENV: production

      - name: Release Summary
        if: always()
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Multi-platform binaries built" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GitHub release created" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.npm_token_check.outputs.npm_available }}" == "true" ]; then
            echo "- ✅ Package published to npm" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ npm publishing skipped (NPM_TOKEN not configured)" >> $GITHUB_STEP_SUMMARY
          fi
