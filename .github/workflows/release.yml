# Release Workflow v3.0.0
# Contract: specs/019-release-workflow/contracts/workflow-interface.md
#
# This workflow automates the complete release process using semantic-release:
# - Parses conventional commits to determine semantic version bump
# - Updates package.json and CHANGELOG.md
# - Commits changes and creates git tag
# - Builds multi-platform binaries with correct version (via @semantic-release/exec)
# - Publishes wrapper scripts used by npm and curl installer paths
# - Generates SHA-256 checksum manifest for release artifacts
# - Creates GitHub release with wrappers, binaries, and checksum manifest
# - Publishes package to npm registry using npm Trusted Publishing
#
# Trigger: Manual workflow dispatch from GitHub Actions UI
# Target: Complete release in under 10 minutes from trigger to publication
#
# Plugin order matters:
#   1. commit-analyzer: Determine release type
#   2. release-notes-generator: Generate changelog content
#   3. changelog: Update CHANGELOG.md file
#   4. npm: Update package.json version
#   5. git: Commit changes and create tag
#   6. exec: Build binaries with new version
#   7. github: Create GitHub release with wrappers + binaries + checksums

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual release)"
        required: false
        type: boolean
        default: false

env:
  # Bun 1.3.12 produced macOS compiled binaries that exit 137 immediately on launch.
  # Pin release builds to a known-good compiler until a later Bun version is verified.
  BUN_VERSION: "1.3.10"

permissions:
  contents: write # Create tags, commits, releases
  pull-requests: write # Comment on PRs (optional)
  issues: write # Comment on closed issues (optional)
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "🧪 Running in DRY-RUN mode - no release will be created"
            echo "🔨 Validating binary + checksum build steps"
            bun run build:all
            ./scripts/generate-checksums.sh
            bunx semantic-release --dry-run
          else
            echo "🚀 Running semantic-release..."
            bunx semantic-release
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      - name: Release Summary
        if: always()
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Semantic release completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Wrapper scripts published for installer parity with npm" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Multi-platform binaries built with correct version" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SHA-256 checksum manifest generated for release artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GitHub release created with wrappers, binaries, and checksum manifest" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "- ✅ Package published to npm via Trusted Publishing" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ npm publishing skipped (dry run)" >> $GITHUB_STEP_SUMMARY
          fi
