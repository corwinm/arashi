name: Verify published aw release

on:
  workflow_call:
    inputs:
      version:
        description: Exact published version without v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact published version without v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  wait-for-publication:
    name: Wait for npm publication
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - name: Wait for exact public npm version
        env:
          VERIFY_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERIFY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Exact version required" >&2
            exit 2
          fi
          for attempt in $(seq 1 20); do
            published="$(npm view "arashi@$VERIFY_VERSION" version --json 2>/dev/null || true)"
            if [ "$published" = "\"$VERIFY_VERSION\"" ]; then
              exit 0
            fi
            echo "Attempt $attempt: arashi@$VERIFY_VERSION is not public yet"
            sleep 30
          done
          echo "arashi@$VERIFY_VERSION did not become public in time" >&2
          exit 1

  verify-aw-posix:
    needs: wait-for-publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.22.0
          runtime: node@24.18.0
          cache: true
          install: false
      - name: Install supported shells
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - run: pnpm install --frozen-lockfile
      - name: Verify exact public npm and POSIX release
        env:
          VERIFY_VERSION: ${{ inputs.version }}
        run: pnpm release:verify-aw -- "$VERIFY_VERSION"

  verify-aw-windows:
    needs: wait-for-publication
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.22.0
          runtime: node@24.18.0
          cache: true
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      - name: Reject a non-exact version
        shell: powershell
        env:
          VERIFY_VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERIFY_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Exact version required" }
      - name: Verify public npm package
        shell: powershell
        env:
          VERIFY_VERSION: ${{ inputs.version }}
        run: pnpm release:verify-aw -- "$env:VERIFY_VERSION"
      - name: Install the exact official Windows release
        shell: powershell
        env:
          VERIFY_VERSION: ${{ inputs.version }}
        run: |
          $env:ARASHI_VERSION = $env:VERIFY_VERSION
          irm https://arashi.haphazard.dev/install.ps1 -OutFile "$env:RUNNER_TEMP\install.ps1"
          & "$env:RUNNER_TEMP\install.ps1"
          $installed = Join-Path $env:USERPROFILE ".arashi\bin"
          $env:Path = "$installed;$env:Path"
          $env:ARASHI_INSTALL_DIR = $installed
          $env:ARASHI_EXPECTED_VERSION = $env:VERIFY_VERSION

          $powerShellVerifier = Join-Path $env:RUNNER_TEMP "verify-aw-fresh.ps1"
          @'
          $ErrorActionPreference = "Stop"
          $canonical = Get-Command arashi -CommandType ExternalScript
          $alias = Get-Command aw -CommandType ExternalScript
          if ($canonical.Source -cne (Join-Path $env:ARASHI_INSTALL_DIR "arashi.ps1")) { throw "PowerShell arashi resolved to $($canonical.Source)" }
          if ($alias.Source -cne (Join-Path $env:ARASHI_INSTALL_DIR "aw.ps1")) { throw "PowerShell aw resolved to $($alias.Source)" }
          $canonicalVersion = (arashi --version | Out-String).Trim()
          $aliasVersion = (aw --version | Out-String).Trim()
          if ($canonicalVersion -cne $aliasVersion) { throw "PowerShell entrypoint versions differ" }
          if ($canonicalVersion -notmatch [regex]::Escape($env:ARASHI_EXPECTED_VERSION)) { throw "PowerShell did not dispatch exact version $env:ARASHI_EXPECTED_VERSION" }
          '@ | Set-Content -LiteralPath $powerShellVerifier
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $powerShellVerifier
          if ($LASTEXITCODE -ne 0) { throw "Fresh PowerShell verification failed" }

          $cmdVerifier = Join-Path $env:RUNNER_TEMP "verify-aw-fresh.cmd"
          @'
          @echo off
          setlocal
          for /f "delims=" %%P in ('where arashi ^| findstr /i /e /c:"\arashi.bat"') do if not defined ARASHI_CANONICAL_PATH set "ARASHI_CANONICAL_PATH=%%P"
          for /f "delims=" %%P in ('where aw ^| findstr /i /e /c:"\aw.bat"') do if not defined ARASHI_ALIAS_PATH set "ARASHI_ALIAS_PATH=%%P"
          if /i not "%ARASHI_CANONICAL_PATH%"=="%ARASHI_INSTALL_DIR%\arashi.bat" exit /b 31
          if /i not "%ARASHI_ALIAS_PATH%"=="%ARASHI_INSTALL_DIR%\aw.bat" exit /b 32
          for /f "delims=" %%V in ('arashi --version') do set "ARASHI_CANONICAL_VERSION=%%V"
          for /f "delims=" %%V in ('aw --version') do set "ARASHI_ALIAS_VERSION=%%V"
          if not "%ARASHI_CANONICAL_VERSION%"=="%ARASHI_ALIAS_VERSION%" exit /b 33
          echo(%ARASHI_CANONICAL_VERSION%| findstr /c:"%ARASHI_EXPECTED_VERSION%" >nul || exit /b 34
          '@ | Set-Content -LiteralPath $cmdVerifier -Encoding ASCII
          & cmd.exe /d /s /c $cmdVerifier
          if ($LASTEXITCODE -ne 0) { throw "Fresh Command Prompt verification failed" }

          $bash = "C:\Program Files\Git\bin\bash.exe"
          $bashVerifier = Join-Path $env:RUNNER_TEMP "verify-aw-fresh.sh"
          $bashVerifierContent = @'
          #!/usr/bin/env bash
          set -e
          installed=$(cygpath -u "$ARASHI_INSTALL_DIR")
          test "$(command -v arashi)" = "$installed/arashi" || exit 41
          test "$(command -v aw)" = "$installed/aw" || exit 42
          canonical=$(arashi --version)
          alias=$(aw --version)
          test "$canonical" = "$alias" || exit 43
          case "$canonical" in
            *"$ARASHI_EXPECTED_VERSION"*) ;;
            *) exit 44 ;;
          esac
          '@
          [System.IO.File]::WriteAllText($bashVerifier, (($bashVerifierContent -replace "`r`n", "`n") + "`n"), [System.Text.Encoding]::ASCII)
          & $bash --noprofile --norc $bashVerifier
          if ($LASTEXITCODE -ne 0) { throw "Fresh Git Bash verification failed" }
