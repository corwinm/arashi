name: Recover Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to recover (for example v1.11.2)"
        required: true
        type: string
      publish_npm:
        description: "Publish the tagged version to npm if it is not already available"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Validate recovery steps without publishing"
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BUN_VERSION: "1.3.10"

permissions:
  contents: write

jobs:
  recover:
    name: Recover Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify requested tag and package version
        run: |
          git rev-parse -q --verify "refs/tags/${{ github.event.inputs.tag }}"
          version_from_tag="${{ github.event.inputs.tag }}"
          version_from_tag="${version_from_tag#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [ "$package_version" != "$version_from_tag" ]; then
            echo "package.json version ($package_version) does not match requested tag (${{ github.event.inputs.tag }})"
            exit 1
          fi

          echo "Recovering tag ${{ github.event.inputs.tag }} for package version $package_version"

      - name: Build release assets
        run: |
          bun run build:all
          ./scripts/generate-checksums.sh
          ls -lh bin/

      - name: Validate npm publish configuration
        if: ${{ github.event.inputs.publish_npm == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN is required when publish_npm is enabled"
            exit 1
          fi

      - name: Publish npm package if missing
        id: npm_publish
        if: ${{ github.event.inputs.publish_npm == 'true' }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if npm view "arashi@$VERSION" version >/dev/null 2>&1; then
            echo "npm already contains arashi@$VERSION; skipping publish"
            exit 0
          fi

          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "🧪 Dry run: would publish arashi@$VERSION to npm"
            exit 0
          fi

          echo "📦 Publishing arashi@$VERSION to npm"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create or update GitHub release
        id: github_release_recovery
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            DRY_RUN=true ./scripts/recover-release.sh "${{ github.event.inputs.tag }}"
          else
            ./scripts/recover-release.sh "${{ github.event.inputs.tag }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recovery Summary
        if: always()
        run: |
          echo "## Recover Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ github.event.inputs.tag }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.github_release_recovery.outcome }}" == "success" ]; then
            if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
              echo "- ✅ Dry run completed" >> $GITHUB_STEP_SUMMARY
              echo "- ℹ️ No GitHub release or npm publish was performed" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ✅ GitHub release recovery completed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ❌ Release recovery failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ github.event.inputs.publish_npm }}" == "true" ]; then
            if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
              echo "- ℹ️ npm publish was validated only" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ steps.npm_publish.outcome }}" == "success" ]; then
              echo "- ✅ npm publish step completed" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ npm publish step failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⚠️ npm publish not requested" >> $GITHUB_STEP_SUMMARY
          fi
