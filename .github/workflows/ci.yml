name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write
  pull-requests: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated config schema
        run: bun run schema:check

      - name: Validate README documentation link target
        run: |
          if grep -qF "arashi-docs.netlify.app" README.md; then
            echo "Deprecated docs domain found in README.md"
            exit 1
          fi
          if ! grep -qF "[Documentation](https://arashi.haphazard.dev)" README.md; then
            echo "README.md must include [Documentation](https://arashi.haphazard.dev)"
            exit 1
          fi

      - name: Run lint gate
        id: lint
        run: bun run lint:ci

      - name: Run format gate
        id: format
        run: bun run format:check

      - name: Report quality gate failure guidance
        if: failure()
        run: |
          echo "Quality checks failed."
          echo "Run 'bun run lint:fix' and 'bun run format' locally, then retry the workflow."
          echo "If lint still fails, run 'bun run lint' for full diagnostics and fix listed files."

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [quality, test]

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: arashi-linux-x64
            script: build:linux

          - os: macos-latest
            target: bun-darwin-arm64
            artifact: arashi-macos-arm64
            script: build:mac

          - os: windows-latest
            target: bun-windows-x64
            artifact: arashi-windows-x64.exe
            script: build:windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}
          retention-days: 30

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    needs: [build]

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: arashi-linux-x64

          - os: macos-latest
            artifact: arashi-macos-arm64

          - os: windows-latest
            artifact: arashi-windows-x64.exe

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Set executable permissions (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x ${{ matrix.artifact }}

      - name: Run version check
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./${{ matrix.artifact }} --version
          else
            ./${{ matrix.artifact }} --version
          fi
