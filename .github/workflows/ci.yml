name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Bun 1.3.12 produced macOS compiled binaries that exit 137 immediately on launch.
  # Pin release and CI builds to a known-good compiler until a later Bun version is verified.
  BUN_VERSION: "1.3.10"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  pull-requests: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate generated config schema
        run: pnpm run schema:check

      - name: Validate CLI command contract
        run: pnpm run contract:check

      - name: Validate generated shell completions
        run: pnpm run completion:check

      - name: Validate README documentation link target
        run: |
          if grep -qF "arashi-docs.netlify.app" README.md; then
            echo "Deprecated docs domain found in README.md"
            exit 1
          fi
          if ! grep -qF "[Documentation](https://arashi.haphazard.dev)" README.md; then
            echo "README.md must include [Documentation](https://arashi.haphazard.dev)"
            exit 1
          fi

      - name: Run lint gate
        id: lint
        run: pnpm run lint:ci

      - name: Run format gate
        id: format
        run: pnpm run format:check

      - name: Report quality gate failure guidance
        if: failure()
        run: |
          echo "Quality checks failed."
          echo "Run 'pnpm run lint:fix' and 'pnpm run format' locally, then retry the workflow."
          echo "If lint still fails, run 'pnpm run lint' for full diagnostics and fix listed files."

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install native completion shells
        if: runner.os == 'Linux'
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_options[@]}" update
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install --yes fish zsh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  hook-input-wrapper:
    name: Installed Wrapper Hook Input Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download built Linux package binary
        uses: actions/download-artifact@v8
        with:
          name: arashi-linux-x64
          path: bin

      - name: Prepare installed package entrypoint
        run: |
          cp bin/arashi-linux-x64 bin/arashi.bin
          chmod +x bin/arashi.bin bin/arashi

      - name: Verify built POSIX and installed package hook input acceptance
        env:
          ARASHI_BUILT_HOOK_ACCEPTANCE: "1"
          ARASHI_WRAPPER_ACCEPTANCE: "1"
        run: pnpm exec vitest run tests/integration/hook-input-built-posix.test.ts tests/integration/inline-hook-built-posix.test.ts tests/integration/hook-input-wrapper.test.ts tests/unit/arashi-wrapper.test.ts

  build:
    name: Native Build and Acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [quality]

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: arashi-linux-x64
            script: build:linux

          - os: macos-latest
            target: bun-darwin-arm64
            artifact: arashi-macos-arm64
            script: build:mac

          - os: windows-latest
            target: bun-windows-x64
            artifact: arashi-windows-x64.exe
            script: build:windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build binary
        run: pnpm run ${{ matrix.script }}

      - name: Set executable permissions (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x bin/${{ matrix.artifact }}

      - name: Run version and completion checks
        shell: bash
        run: |
          ./bin/${{ matrix.artifact }} --version
          for shell in bash zsh fish; do
            ./bin/${{ matrix.artifact }} completion "$shell" > "completion-$shell"
            test -s "completion-$shell"
            grep -q 'arashi-completion-contract-v6:' "completion-$shell"
          done

      - name: Exercise built-CLI materialization safety contract
        run: node --experimental-strip-types tests/native/materialization-native.ts "bin/${{ matrix.artifact }}"

      - name: Upload accepted artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}
          retention-days: 30

  windows-installer-acceptance:
    name: Windows Installer Acceptance
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: arashi-windows-x64.exe
          path: bin

      - name: Exercise transactional replacement and rollback
        shell: powershell
        run: ./tests/windows/install-transaction.ps1

      - name: Install with canonical defaults and verify fresh shells
        shell: powershell
        run: ./tests/windows/default-installer-acceptance.ps1

  hook-input-native:
    name: Native Windows Hook Input Acceptance
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install PTY acceptance dependency
        run: pnpm install --frozen-lockfile

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: arashi-windows-x64.exe
          path: bin

      - name: Exercise terminal and immediate-EOF hook input
        shell: powershell
        run: ./tests/windows/hook-input-native.ps1
