[package]
name = "arashi-rust"
version = "2.0.0-alpha.1"
edition = "2024"
publish = false

[lib]
name = "arashi"
path = "src/rust/lib.rs"

[[bin]]
name = "arashi"
path = "src/rust/main.rs"

[[bin]]
name = "aw"
path = "src/rust/aw.rs"

[[bin]]
name = "arashi2"
path = "src/rust/arashi2.rs"

[[bin]]
name = "aw2"
path = "src/rust/aw2.rs"

[[test]]
name = "rust_config"
path = "tests/rust_config.rs"

[[test]]
name = "rust_cli"
path = "tests/rust_cli.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }
tempfile = "3"
# ZIP decoding only: omit the optional zopfli encoder.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }

[[test]]
name = "rust_status"
path = "tests/rust_status.rs"

[[test]]
name = "rust_init"
path = "tests/rust_init.rs"

[[test]]
name = "rust_parity"
path = "tests/rust_parity.rs"

[[test]]
name = "rust_prune"
path = "tests/rust_prune.rs"

[[bin]]
name = "arashi2-setup"
path = "src/rust/alpha_setup.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
